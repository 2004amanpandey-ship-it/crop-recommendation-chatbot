<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farming Assistant</title>
<style>
/* Fullscreen reset */
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #e5ddd5;
  transition: background 0.3s, color 0.3s;
}
body.dark {
  background: #121212;
  color: #fff;
}

/* Chat container fullscreen */
.chat-container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #e5ddd5;
  overflow: hidden;
}
body.dark .chat-container { background: #121212; }

/* Header */
.chat-header {
  background: #075e54;
  color: white;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.header-text { display: flex; flex-direction: column; }
.header-text span { font-size: 14px; opacity: 0.8; }

/* Dark mode toggle */
#modeToggle {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  background: white;
  color: #075e54;
  transition: all 0.3s;
}
body.dark #modeToggle { background: #333; color: #fff; }

/* Chat box */
.chat-box {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}

/* Messages bubbles */
.message {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  position: relative;
  word-wrap: break-word;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  transition: background 0.3s, color 0.3s;
}
.user {
  background: #dcf8c6;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
body.dark .user { background: #25d366; color: #fff; }
.bot {
  background: #fff;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
body.dark .bot { background: #2a2a2a; color: #fff; }
.time {
  font-size: 10px;
  opacity: 0.6;
  margin-top: 4px;
  text-align: right;
}

/* WhatsApp-style typing dots */
.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0;
}
.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #000;
  opacity: 0.3;
  animation: blinkPulse 1.2s infinite ease-in-out;
}
body.dark .typing-dot { background: #fff; }
.typing-dot:nth-child(1) { animation-delay: 0s; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blinkPulse {
  0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* Chat input */
.chat-input {
  display: flex;
  padding: 10px;
  gap: 8px;
  background: #f0f0f0;
  transition: background 0.3s;
}
body.dark .chat-input { background: #1e1e1e; }
.chat-input input {
  flex: 1;
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  font-size: 14px;
  outline: none;
  background: #fff;
  transition: background 0.3s, color 0.3s;
}
body.dark .chat-input input { background: #2a2a2a; color: #fff; }
.chat-input button {
  background: #25d366;
  border: none;
  color: white;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}
.chat-input button:hover { background: #1ebe5d; }

/* Responsive */
@media(max-width:500px){ .chat-container { width:100%; height:100%; } }
</style>
</head>
<body class="light">

<div class="chat-container">
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">🌾</div>
      <div class="header-text">
        <strong>Farming Assistant</strong>
        <span>online</span>
      </div>
    </div>
    <button id="modeToggle">Dark Mode</button>
  </div>

  <div id="chatBox" class="chat-box"></div>

  <div class="chat-input">
    <input id="messageInput" placeholder="Type a message"/>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
/* Dark/Light toggle */
const modeBtn = document.getElementById('modeToggle');
modeBtn.addEventListener('click',()=>{
  document.body.classList.toggle('dark');
  document.body.classList.toggle('light');
  modeBtn.textContent = document.body.classList.contains('dark') ? "Light Mode" : "Dark Mode";
});

/* Time */
function getTime(){
  let now=new Date(), h=now.getHours(), m=now.getMinutes();
  if(m<10) m="0"+m;
  return h+":"+m;
}

/* Add message */
function addMessage(text,type){
  let box=document.getElementById("chatBox"),
      div=document.createElement("div");
  div.classList.add("message",type);
  div.innerHTML=text+'<div class="time">'+getTime()+'</div>';
  box.appendChild(div);
  box.scrollTo({top:box.scrollHeight, behavior:'smooth'});
}

/* Typing indicator - WhatsApp-style */
function showTyping(){
  let box=document.getElementById("chatBox"),
      typing=document.createElement("div");
  typing.classList.add("message","bot","typing");
  typing.id="typing";
  typing.innerHTML='<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  box.appendChild(typing);
  box.scrollTo({top:box.scrollHeight, behavior:'smooth'});
}
function removeTyping(){
  let t=document.getElementById("typing");
  if(t) t.remove();
}

/* Send message - existing API */
function sendMessage(){
  let input=document.getElementById("messageInput"),
      message=input.value;
  if(message.trim()==="") return;
  addMessage(message,"user");
  input.value="";
  showTyping();
  fetch("/chat/",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:message})
  })
  .then(res=>res.json())
  .then(data=>{
    removeTyping();
    addMessage(data.response,"bot");
  });
}

/* Enter key */
document.getElementById("messageInput")
.addEventListener("keypress",function(e){
  if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
